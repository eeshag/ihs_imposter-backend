services:
  - type: web
    name: ihs-imposter-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: https://your-frontend-domain.onrender.com,http://localhost:3000
        # Update the frontend URL above with your actual frontend deployment URL
